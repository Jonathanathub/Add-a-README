<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Week planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='30' fill='%230f1518'/%3E%3Crect x='26' y='30' width='140' height='20' fill='%23e9eef1'/%3E%3Crect x='26' y='66' width='62' height='18' fill='%23f0e14f'/%3E%3Crect x='104' y='66' width='62' height='18' fill='%235ec8e8'/%3E%3Crect x='26' y='96' width='62' height='18' fill='%23f28f36'/%3E%3Crect x='104' y='96' width='62' height='18' fill='%238ed24d'/%3E%3Crect x='26' y='126' width='140' height='18' fill='%236e7c86'/%3E%3C/svg%3E">
<style>
  :root{
    --panel:#6e7c86;--panel-dark:#5d6a74;--ink:#141a1e;--chalk:#e9eef1;--c-cyan:#5ec8e8;
    --cond:'Arial Narrow','Helvetica Neue',Inter,system-ui,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0f1518;color:var(--chalk);font-family:var(--cond);
       overscroll-behavior-y:contain;-webkit-text-size-adjust:100%}
  .wrap{max-width:1180px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom))}

  .bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .plate{flex:1;background:linear-gradient(180deg,#8d99a2,#6d7a84);border:1px solid #3d4952;border-radius:3px;
         box-shadow:inset 0 1px 0 rgba(255,255,255,.35);padding:8px 10px;min-width:0}
  #title{width:100%;font:600 15px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;
         color:#10171b;background:transparent;border:0;outline:0}
  button{font:600 11px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:#dfe6ea;
         background:#39454e;border:1px solid #556570;border-radius:3px;padding:11px 12px;cursor:pointer}
  button:active{background:#4b5862}
  button:focus-visible,#title:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--c-cyan);outline-offset:2px}

  .note{display:none;font:600 10px/1.4 var(--cond);letter-spacing:.14em;text-transform:uppercase;
        color:#0f1518;background:var(--c-cyan);border-radius:3px;padding:8px 10px;margin-bottom:10px}
  .note.on{display:block}
  .hint{font-size:12px;letter-spacing:.05em;color:#7d8d97;margin:0 0 10px}

  .tabs{display:none;gap:4px;margin-bottom:10px}
  .tabs.on{display:flex}
  .tab{flex:1;padding:9px 0 7px;border-radius:3px;border:1px solid #2a343b;
       background:linear-gradient(180deg,#4d5a64,#3b4750);color:#c3ced5;
       font:700 11px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase}
  .tab[aria-selected=true]{background:linear-gradient(180deg,#f4f5f1,#d9ddd6);color:#161d21;border-color:#8a938c}
  .tab i{display:block;height:4px;width:4px;border-radius:50%;background:var(--c-cyan);margin:4px auto 0;opacity:0}
  .tab.has i{opacity:1}
  .tab[aria-selected=true] i{background:#2a343b}

  .board{background:linear-gradient(180deg,#3a464f,#232d34);border:1px solid #1a2227;border-radius:5px;
         padding:8px;box-shadow:0 14px 34px rgba(0,0,0,.5);overflow-x:auto}
  .grid{display:grid;background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 2px,transparent 2px 5px),
      linear-gradient(180deg,var(--panel),var(--panel-dark));border:1px solid #212b31}
  .grid.week{grid-template-columns:52px repeat(7,minmax(96px,1fr));grid-auto-rows:22px;min-width:720px}
  .grid.day{grid-template-columns:54px 1fr;grid-auto-rows:36px}

  .head{grid-row:1;position:sticky;top:0;z-index:5;height:34px;
        background:linear-gradient(180deg,#f4f5f1,#d9ddd6);color:#161d21;
        border-right:1px solid #9aa39c;border-bottom:2px solid #2a343b;
        font:700 11px/34px var(--cond);letter-spacing:.2em;text-align:center}
  .head.corner{background:linear-gradient(180deg,#4d5a64,#39454e);color:#c3ced5;letter-spacing:.1em}
  .head.today{background:linear-gradient(180deg,#ffe98a,#f0d24f)}

  .time{grid-column:1;border-right:2px solid #2a343b;background:linear-gradient(90deg,#42505a,#4c5a64);
        font:500 10px/1 var(--mono);color:#c9d5dc;text-align:right;padding:4px 6px 0 0}
  .grid.week .time{line-height:22px;padding-top:0}
  .time.half{opacity:.35}
  .grid.week .time.half{color:transparent}
  .time.hour{border-top:1px solid rgba(255,255,255,.12)}

  .slot{border-right:1px solid #4a5760;border-bottom:1px solid rgba(0,0,0,.16);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .slot.hour{border-top:1px solid rgba(255,255,255,.16)}
  .slot.now{background:rgba(94,200,232,.16)}

  .card{position:relative;z-index:2;align-self:stretch;justify-self:start;border-radius:2px;
        border:1px solid rgba(0,0,0,.35);box-shadow:0 2px 4px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5);
        color:var(--ink);padding:4px 6px;overflow:hidden;text-align:left;
        font:700 11px/1.2 var(--cond);letter-spacing:.07em;text-transform:uppercase;
        margin:1px 2px 1px 1px;animation:drop .22s cubic-bezier(.2,.8,.3,1)}
  .grid.week .card{font-size:10.5px;padding:3px 5px}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(0,0,0,.28)}
  .card b{display:block}
  .card span{display:block;font:500 10px/1.2 var(--mono);letter-spacing:0;opacity:.72;text-transform:none;margin-top:2px}
  @keyframes drop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.card{animation:none}}

  .fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:15;
       width:58px;height:58px;border-radius:50%;padding:0;background:var(--c-cyan);color:#0d1417;
       border:1px solid #3ba9c9;box-shadow:0 6px 18px rgba(0,0,0,.5);font:400 30px/1 var(--cond)}

  .scrim{position:fixed;inset:0;background:rgba(6,10,12,.62);display:none;z-index:20}
  .scrim.on{display:block}
  .sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(460px,100%);z-index:21;display:none;
         background:linear-gradient(180deg,#48555f,#2f3a42);border:1px solid #1c2429;border-radius:12px 12px 0 0;
         padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -14px 40px rgba(0,0,0,.55);
         max-height:88vh;overflow-y:auto}
  .sheet.on{display:block}
  .grip{width:38px;height:4px;border-radius:2px;background:#7b8b95;margin:0 auto 12px}
  .sheet h2{margin:0 0 12px;font:700 12px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:#b9c6cf}
  .sheet p{font:400 12px/1.5 var(--cond);letter-spacing:.03em;color:#93a3ad;margin:0 0 14px}
  label{display:block;font:600 10px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase;color:#93a3ad;margin:0 0 6px}
  input[type=text],select,textarea{width:100%;padding:12px 10px;border-radius:3px;border:1px solid #5b6a74;
    background:#1d262b;color:#e8eef1;font:500 16px/1.3 var(--cond);letter-spacing:.03em;appearance:none}
  textarea{font:500 12px/1.4 var(--mono);height:80px;resize:none;word-break:break-all}
  .row{display:flex;gap:8px;margin-top:12px}
  .row>div{flex:1;min-width:0}
  .swatches{display:flex;gap:8px;margin-top:6px}
  .sw{flex:1;height:38px;border-radius:2px;border:1px solid rgba(0,0,0,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);padding:0}
  .sw[aria-pressed=true]{outline:2px solid #fff;outline-offset:2px}
  .actions{display:flex;gap:8px;margin-top:18px}
  .actions button{flex:1;padding:14px}
  .save{background:var(--c-cyan);color:#0d1417;border-color:#3ba9c9}
  .del{background:#5a2f2f;border-color:#7d4747;flex:0 0 92px}
  .stack button{width:100%;padding:14px;margin-top:8px}
  .divider{height:1px;background:#5b6a74;margin:18px 0 14px;opacity:.5}

  @media print{
    .bar,.hint,.fab,.tabs,.note{display:none}
    body{background:#fff}
    .board{box-shadow:none;background:#fff;border:0;padding:0}
    .grid.week{min-width:0}
  }
</style>

<div class="wrap">
  <div class="bar">
    <div class="plate"><input id="title" value="Week planner" aria-label="Board title"></div>
    <button id="view">Week</button>
    <button id="menu" aria-label="Menu">•••</button>
  </div>
  <div class="note" id="note"></div>
  <p class="hint" id="hint">Tap a slot to drop a card in. Swipe to change day.</p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="board" id="boardEl"><div class="grid" id="grid"></div></div>
</div>

<button class="fab" id="add" aria-label="Add card">+</button>
<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grip"></div>
  <h2 id="sheetTitle">Card</h2>
  <label for="ftext">What's on</label>
  <input type="text" id="ftext" placeholder="Gym, applications, deep work…" maxlength="40">
  <div class="row">
    <div><label for="fday">Day</label><select id="fday"></select></div>
    <div><label for="fstart">Starts</label><select id="fstart"></select></div>
    <div><label for="flen">Length</label><select id="flen"></select></div>
  </div>
  <label style="margin-top:12px">Colour</label>
  <div class="swatches" id="sw"></div>
  <div class="actions">
    <button class="del" id="del">Remove</button>
    <button id="cancel">Cancel</button>
    <button class="save" id="save">Save card</button>
  </div>
</div>

<div class="sheet" id="msheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="grip"></div>
  <h2 id="mTitle">Board</h2>
  <p id="mstat">Your board is written into this page's address, so the home-screen icon carries it even if the phone clears its storage.</p>
  <label for="code">Backup code — keep a copy in Notes</label>
  <textarea id="code" readonly></textarea>
  <div class="row"><div><button id="copy" style="width:100%;padding:13px">Copy code</button></div></div>
  <div class="divider"></div>
  <label for="restore">Restore from a code</label>
  <textarea id="restore" placeholder="Paste a backup code here"></textarea>
  <div class="stack">
    <button id="dorestore">Restore board</button>
    <button id="print">Print board</button>
    <button class="del" id="clear" style="flex:none">Clear board</button>
    <button id="mclose">Close</button>
  </div>
</div>

<script>
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const START_H=6,END_H=22,STEP=30,SLOTS=(END_H-START_H)*60/STEP;
const HEX=['#f0e14f','#f28f36','#5ec8e8','#8ed24d','#b79ae8','#f2f2ec'];
const NAMES=['yellow','orange','cyan','green','violet','white'];
const KEY='weekboard';
const $=id=>document.getElementById(id);
const label=i=>{const m=START_H*60+i*STEP;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>(new Date().getDay()+6)%7;

let state={t:'Week planner',u:0,e:[]};
let editing=null,ci=0,manual=null,day=today(),scrolled=false;
const mode=()=>manual||(window.matchMedia('(max-width:700px)').matches?'day':'week');

/* ---------- portable encoding: the board travels in the address ---------- */
const enc=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=b=>decodeURIComponent(escape(atob(b.replace(/-/g,'+').replace(/_/g,'/'))));
const pack=s=>enc(JSON.stringify({t:s.t,u:s.u,e:s.e.map(c=>[c.day,c.start,c.len,c.ci,c.text])}));
function unpack(code){
  const o=JSON.parse(dec(code.trim()));
  return {t:o.t||'Week planner',u:o.u||0,
    e:(o.e||[]).map(a=>({id:uid(),day:a[0],start:a[1],len:a[2],ci:a[3]||0,text:a[4]||''}))};
}

function load(){
  let fromLink=null,fromPhone=null;
  try{if(location.hash.length>1)fromLink=unpack(location.hash.slice(1));}catch(e){}
  try{const s=localStorage.getItem(KEY);if(s)fromPhone=unpack(s);}catch(e){}
  if(fromLink&&fromPhone) state=fromLink.u>fromPhone.u?fromLink:fromPhone;
  else state=fromLink||fromPhone||state;
  if(fromLink&&!fromPhone&&fromLink.e.length) flash('Board restored from your saved link');
  $('title').value=state.t;
  render();
}

function save(){
  state.u=Date.now();
  const code=pack(state);
  try{localStorage.setItem(KEY,code);}catch(e){}
  try{history.replaceState(null,'','#'+code);}catch(e){location.hash=code;}
  $('code').value=code;
}

let ft;
function flash(msg){
  const n=$('note');n.textContent=msg;n.classList.add('on');
  clearTimeout(ft);ft=setTimeout(()=>n.classList.remove('on'),4000);
}

/* ---------- lanes for clashing cards ---------- */
function lanes(list){
  const s=[...list].sort((a,b)=>a.start-b.start||a.len-b.len);
  const out=[];let cluster=[],end=-1;
  const flush=()=>{const busy=[];
    cluster.forEach(c=>{let l=0;while(busy[l]!==undefined&&busy[l]>c.start)l++;busy[l]=c.start+c.len;c._lane=l;});
    cluster.forEach(c=>{c._lanes=busy.length;out.push(c);});cluster=[];};
  s.forEach(c=>{if(cluster.length&&c.start>=end)flush();cluster.push(c);end=Math.max(end,c.start+c.len);});
  if(cluster.length)flush();
  return out;
}
function nowSlot(){
  const d=new Date(),m=d.getHours()*60+d.getMinutes()-START_H*60;
  return (m<0||m>=SLOTS*STEP)?-1:Math.floor(m/STEP);
}

/* ---------- render ---------- */
function render(){
  const m=mode(),g=$('grid'),ns=nowSlot();
  g.className='grid '+m;g.innerHTML='';
  $('view').textContent=m==='day'?'Week':'Day';
  $('hint').textContent=m==='day'?"Tap a slot to drop a card in. Swipe to change day."
                                 :"Tap a slot to drop a card in. Tap a card to edit it.";
  $('tabs').classList.toggle('on',m==='day');
  if(m==='day'){
    const tb=$('tabs');tb.innerHTML='';
    DAYS.forEach((d,i)=>{
      const b=document.createElement('button');
      b.className='tab'+(state.e.some(c=>c.day===i)?' has':'');
      b.setAttribute('role','tab');b.setAttribute('aria-selected',i===day);
      b.innerHTML=d.toUpperCase()+'<i></i>';
      b.onclick=()=>{day=i;render();};tb.appendChild(b);
    });
  }
  const cols=m==='day'?[day]:[0,1,2,3,4,5,6];

  const corner=document.createElement('div');
  corner.className='head corner';corner.textContent='TIME';corner.style.gridColumn=1;g.appendChild(corner);
  cols.forEach((d,i)=>{
    const h=document.createElement('div');
    h.className='head'+(d===today()?' today':'');
    h.textContent=DAYS[d].toUpperCase()+(m==='day'&&d===today()?' · TODAY':'');
    h.style.gridColumn=i+2;g.appendChild(h);
  });

  for(let s=0;s<SLOTS;s++){
    const hour=s%2===0;
    const tl=document.createElement('div');
    tl.className='time '+(hour?'hour':'half');
    tl.textContent=label(s);tl.style.gridRow=s+2;g.appendChild(tl);
    cols.forEach((d,i)=>{
      const c=document.createElement('div');
      const isNow=(s===ns&&d===today());
      c.className='slot'+(hour?' hour':'')+(isNow?' now':'');
      c.style.gridColumn=i+2;c.style.gridRow=s+2;
      if(isNow)c.id='nowMark';
      c.onclick=()=>open_({day:d,start:s,len:2,text:'',ci:0},false);
      g.appendChild(c);
    });
  }

  cols.forEach((d,i)=>lanes(state.e.filter(c=>c.day===d)).forEach(c=>{
    const el=document.createElement('button');
    el.className='card';
    el.style.gridColumn=i+2;
    el.style.gridRow=(c.start+2)+' / span '+c.len;
    el.style.background='linear-gradient(180deg,'+HEX[c.ci]+',color-mix(in srgb,'+HEX[c.ci]+' 86%, #000))';
    el.style.width='calc('+(100/c._lanes)+'% - 3px)';
    el.style.marginLeft='calc('+(c._lane*100/c._lanes)+'%)';
    el.innerHTML='<b></b><span></span>';
    el.querySelector('b').textContent=c.text||'Untitled';
    el.querySelector('span').textContent=label(c.start)+'–'+label(c.start+c.len);
    el.onclick=()=>open_(c,true);
    g.appendChild(el);
  }));

  if(!scrolled&&$('nowMark')){scrolled=true;
    setTimeout(()=>$('nowMark').scrollIntoView({block:'center',behavior:'smooth'}),120);}
}

/* ---------- swipe ---------- */
let sx=0,sy=0;
$('boardEl').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
$('boardEl').addEventListener('touchend',e=>{
  if(mode()!=='day')return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dy)<45){day=(day+(dx<0?1:6))%7;render();}
},{passive:true});

/* ---------- card editor ---------- */
DAYS.forEach((d,i)=>$('fday').add(new Option(d,i)));
for(let s=0;s<SLOTS;s++)$('fstart').add(new Option(label(s),s));
[1,2,3,4,6,8,10,12].forEach(n=>$('flen').add(new Option(n*STEP<60?n*STEP+' min':(n*STEP/60)+' hr',n)));
HEX.forEach((hex,i)=>{
  const b=document.createElement('button');
  b.className='sw';b.style.background=hex;b.setAttribute('aria-label',NAMES[i]);b.dataset.i=i;
  b.onclick=()=>{ci=i;paint();};$('sw').appendChild(b);
});
const paint=()=>[...$('sw').children].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===ci));

function open_(c,exists){
  editing=exists?c:{...c,id:uid()};
  $('sheetTitle').textContent=exists?'Edit card':'New card';
  $('ftext').value=c.text||'';$('fday').value=c.day;$('fstart').value=c.start;
  $('flen').value=Math.min(c.len,12);ci=c.ci||0;paint();
  $('del').style.display=exists?'':'none';
  $('scrim').classList.add('on');$('sheet').classList.add('on');
  if(!('ontouchstart' in window))$('ftext').focus();
}
const closeAll=()=>{$('scrim').classList.remove('on');$('sheet').classList.remove('on');$('msheet').classList.remove('on');editing=null;};

$('save').onclick=()=>{
  if(!editing)return;
  const d=+$('fday').value,start=+$('fstart').value,len=+$('flen').value;
  Object.assign(editing,{day:d,start,len:Math.min(len,SLOTS-start),text:$('ftext').value.trim(),ci});
  if(!state.e.includes(editing))state.e.push(editing);
  if(mode()==='day')day=d;
  closeAll();render();save();
};
$('del').onclick=()=>{state.e=state.e.filter(x=>x.id!==editing.id);closeAll();render();save();};
$('cancel').onclick=closeAll;$('scrim').onclick=closeAll;
$('ftext').onkeydown=ev=>{if(ev.key==='Enter')$('save').click();};
document.onkeydown=ev=>{if(ev.key==='Escape')closeAll();};

/* ---------- board menu ---------- */
$('menu').onclick=()=>{
  $('code').value=pack(state);
  $('scrim').classList.add('on');$('msheet').classList.add('on');
};
$('mclose').onclick=closeAll;
$('copy').onclick=()=>{
  const ta=$('code');ta.select();ta.setSelectionRange(0,99999);
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>{},()=>{});
  $('copy').textContent=ok||navigator.clipboard?'Copied':'Select and copy';
  setTimeout(()=>$('copy').textContent='Copy code',2000);
};
$('dorestore').onclick=()=>{
  const v=$('restore').value.trim();
  if(!v)return;
  try{
    const s=unpack(v.includes('#')?v.split('#').pop():v);
    state=s;$('title').value=state.t;$('restore').value='';
    closeAll();render();save();flash('Board restored — '+state.e.length+' cards');
  }catch(e){alert("That code didn't read properly. Paste the whole thing, with no line breaks.");}
};
$('print').onclick=()=>{closeAll();setTimeout(()=>window.print(),150);};
$('clear').onclick=()=>{if(confirm('Take every card off the board?')){state.e=[];closeAll();render();save();}};

$('add').onclick=()=>open_({day:mode()==='day'?day:today(),start:Math.max(nowSlot(),0),len:2,text:'',ci:0},false);
$('view').onclick=()=>{manual=mode()==='day'?'week':'day';render();};
$('title').oninput=()=>{state.t=$('title').value;save();};
window.addEventListener('resize',()=>{if(!manual)render();});

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
load();
</script>
